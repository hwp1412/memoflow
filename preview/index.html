<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MemoFlow — 学习面板预览</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="../src/ui/dashboard.css">
</head>
<body class="mf-preview">
  <div id="app"></div>
  <div class="preview-controls" role="group" aria-label="预览控制">

    <button type="button" data-control="width">窄屏</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
